[package]
name = "soro-fuzz-example-token"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# rlib only — see examples/counter/Cargo.toml for why.
crate-type = ["rlib"]
doctest = false

[dependencies]
arbitrary = { version = "1.3", features = ["derive"] }
soro-fuzz-core = { version = "0.1.0", path = "../../crates/core" }
soro-fuzz-invariants = { version = "0.1.0", path = "../../crates/invariants" }
soro-fuzz-strategies = { version = "0.1.0", path = "../../crates/strategies" }
soroban-sdk = "27.0.6"

[dev-dependencies]
proptest = "1.11.0"
proptest-arbitrary-interop = "0.1.0"

[features]
default = ["testutils"]
testutils = ["soroban-sdk/testutils"]
