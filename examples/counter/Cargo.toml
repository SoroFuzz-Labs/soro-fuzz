[package]
name = "soro-fuzz-example-counter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# rlib only: this crate is a host-env fuzzing/testing vehicle, not a
# deployable artifact (see README — WASM/guest-level fuzzing is out of
# scope). If you want a deployable .wasm from a contract like this one, add
# "cdylib" back locally and build with `--target wasm32-unknown-unknown`;
# note that also enabling it for native builds hits a MinGW export-ordinal
# linker limit on Windows.
crate-type = ["rlib"]
doctest = false

[dependencies]
arbitrary = { version = "1.3", features = ["derive"] }
soro-fuzz-core = { version = "0.1.0", path = "../../crates/core" }
soro-fuzz-invariants = { version = "0.1.0", path = "../../crates/invariants" }
soro-fuzz-strategies = { version = "0.1.0", path = "../../crates/strategies" }
soroban-sdk = "27.0.6"

[dev-dependencies]
proptest = "1"
proptest-arbitrary-interop = "0.1"

[features]
# See README "testutils gotcha": this must be on (transitively enabling
# soroban-sdk/testutils) for the harness wiring in src/harness.rs to compile,
# since it uses Address::generate/mock auths/SorobanArbitrary. Enabled by
# default for dev convenience; a real wasm release build for deployment
# should use `--no-default-features` to exclude test-only code.
default = ["testutils"]
testutils = ["soroban-sdk/testutils"]
